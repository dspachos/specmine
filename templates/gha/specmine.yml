# specmine gate: lint the .specs/ knowledge base and map PR changes to
# requirements. Runs the skill's scripts directly — they are committed in-repo.
# Verdicts (SATISFIED/VIOLATED) are judgment: that's the review agent's job,
# triggered via /specmine:check — CI here enforces the deterministic floor.
name: specmine

on:
  pull_request:
    paths:
      - ".specs/**"
      - "src/**"
      - "lib/**"
      - "**.php"
      - "**.ts"
      - "**.js"
      - "**.py"

permissions:
  contents: read

jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate .specs (citations, IDs, links, index sync)
        run: node .claude/skills/specmine/scripts/validate.mjs

      - name: Map changed files to requirements
        run: node .claude/skills/specmine/scripts/check.mjs
